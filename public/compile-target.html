<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcador ArUco · Casa de Oficios</title><style>body{font:16px system-ui;background:#f3f0e8;color:#27251f;max-width:720px;margin:8vh auto;padding:24px}h1{font:400 42px Georgia,serif}button{padding:14px 20px;background:#28614f;border:0;color:white;border-radius:4px;font-weight:700;cursor:pointer}a{color:#28614f}#marker{display:block;width:min(72vw,420px);margin:28px 0;border:12px solid white;box-shadow:0 0 0 1px #bbb}</style></head><body><p>CASA DE OFICIOS · MARCADOR DE INVENTARIO</p><h1>ArUco · ID 0</h1><p>Imprime este marcador en blanco y negro, sin recortarlo ni estirarlo. El borde blanco alrededor ayuda a detectarlo. Asócialo al Tapete de mota y apunta la cámara al cuadrado.</p><div id="marker"></div><button id="download">Descargar marcador SVG</button><p><a href="/">Volver al inventario</a></p><script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script><script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script><script>const svg=new AR.Dictionary('ARUCO').generateSVG(0);document.querySelector('#marker').innerHTML=svg;document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='aruco-id-0.svg';a.click();};</script></body></html>
